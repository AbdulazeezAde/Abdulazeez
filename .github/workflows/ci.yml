name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: chat_backend/production-requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r chat_backend/production-requirements.txt

      - name: Check Python syntax and knowledge data
        run: |
          python -m compileall -q chat_backend
          python -c "import json; json.load(open('chat_backend/knowledge.json', encoding='utf-8'))"

      - name: Smoke-test Flask API
        run: |
          python - <<'PY'
          from chat_backend.app import app

          client = app.test_client()
          health = client.get("/health")
          assert health.status_code == 200, health.get_data(as_text=True)
          assert health.get_json()["status"] == "healthy"

          chat = client.post("/chat", json={"message": "What are your skills?"})
          assert chat.status_code == 200, chat.get_data(as_text=True)
          assert chat.get_json().get("answer"), "Chat endpoint returned no answer"
          PY

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip deployment when the Render deploy hook is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Skipping deployment. Add the Render deploy hook URL as the RENDER_DEPLOY_HOOK_URL repository secret."
